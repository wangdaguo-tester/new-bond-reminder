name: 打新债提醒

on:
  schedule:
    # UTC 1:00 = 北京时间 9:00, 周一到周五（作为兜底，GitHub 调度可能延迟）
    - cron: "0 1 * * 1-5"
  workflow_dispatch:
  repository_dispatch:
    types:
      - check-new-bonds

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 检查新债并推送
        env:
          SENDKEY: ${{ secrets.SENDKEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python main.py
