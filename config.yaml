# ===========================================
# 打新债提醒 - 用户配置文件
# 用于配置持仓组合、风控参数和 AI 分析选项
# ===========================================

# 你的基金/股票持仓（手动维护）
# 注意：所有持仓的 weight 之和应为 1.0
portfolio:
  - name: "沪深300ETF"
    type: "stock_etf"        # stock_etf / bond_fund / mixed_fund / stock / cash
    code: "510300"
    weight: 0.3              # 占总投资比例

  - name: "混合基金"
    type: "mixed_fund"
    code: "027127"  # TODO: 替换为你的基金代码
    weight: 0.5

  - name: "现金"
    type: "cash"              # 现金无需代码
    weight: 0.2

# 风控偏好
risk:
  max_position_ratio: 0.3    # 单只新债不超过总资金的 30%
  stop_loss: -0.05           # 最大亏损 5%

# 微信推送通知设置
notifications:
  sendkeys:
    - "SCT387450TPQJ0X0EqmHSXSCItqwEFdKyy"
    # 如需添加更多接收人，在上面的 SendKey 列表中添加
    # SENDKEY 环境变量会自动合并（无需单独添加到此处）

# AI 分析设置
analysis:
  enabled: true              # false = 关闭 AI，纯推送新债名称
  model: "deepseek-chat"     # deepseek-chat 或 deepseek-reasoner
