name = "bond-reminder-trigger"
main = "trigger.js"
compatibility_date = "2026-07-17"

# GitHub 仓库坐标。它们不是敏感信息(仓库本身就是公开的),所以写在这里声明,
# 而不是只在 Dashboard 里手填:deploy 会用本文件的声明替换 Worker 的绑定,
# 没被声明的绑定会被抹掉。2026-09-23 早上就是因为这两个值丢了,trigger.js 拼出
# /repos/undefined/undefined/dispatches 收到 404,提醒静默消失,没人知道。
[vars]
GITHUB_OWNER = "wangdaguo-tester"
GITHUB_REPO = "new-bond-reminder"

[triggers]
# 注意:Cloudflare 的星期字段是 1 = 周日(和 GitHub Actions 相反,那边 1 = 周一)。
# 原来的 "57 0 * * 1-5" 实际是周日~周四,周五从来没触发过。
# 这里改用每天触发绕开歧义:周末没有新债时 main.py 不会推送。
crons = ["57 0 * * *"]
