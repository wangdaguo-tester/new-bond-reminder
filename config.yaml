# ===========================================
# 打新债提醒 - 用户配置文件
# ===========================================

# 微信推送通知设置
#
# ⚠️ 不要在这里写明文 SendKey —— config.yaml 会进版本库，等于公开泄露，
#    任何人都能用它往你的微信推消息。
#
# 推荐做法：把 SendKey 放到环境变量 SENDKEY（GitHub Actions 中配置为 Secrets）。
#   - 单个接收人：SENDKEY=SCTxxxxxxxx
#   - 多个接收人：SENDKEY=SCTxxxxxxxx,SCYyyyyyyyy   （逗号/分号/换行分隔均可）
# 环境变量里的 key 会自动与下面的列表合并、去重。
notifications:
  sendkeys: []

# AI 分析设置
analysis:
  enabled: true              # false = 关闭 AI，纯推送新债名称
  model: "deepseek-chat"     # deepseek-chat 或 deepseek-reasoner
